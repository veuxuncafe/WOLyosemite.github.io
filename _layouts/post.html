---
layout: default
---
<main class="post container">
  <p class="eyebrow">{{ page.categories | first | default: '随笔' }} · {{ page.date | date: '%Y.%m.%d' }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="post-lead">{{ page.description }}</p>{% endif %}
  <div class="post-body">{{ content }}</div>
</main>
