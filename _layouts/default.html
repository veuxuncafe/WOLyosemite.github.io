<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}"><script src="{{ '/script.js' | relative_url }}" defer></script>
</head>
<body>

    <a class="brand" href="{{ '/' | relative_url }}">veuxuncafe<span>.</span></a>

  </div></header>
  {{ content }}
  <footer class="site-footer"><div class="container footer-wrap"><p>© {{ site.time | date: '%Y' }} veuxuncafe</p><a href="https://github.com/veuxuncafe" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">-></span></a></div></footer>
